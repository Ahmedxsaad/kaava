    @keyframes nudge1 { 0%, 80%, 100% { transform: none; } 88% { transform: translateX(1.8px); } 94% { transform: translateX(-.6px); } }
    @keyframes nudge2 { 0%, 80%, 100% { transform: none; } 88% { transform: translateX(-1.8px); } 94% { transform: translateX(.6px); } }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 30% { transform: translateX(258.8px); opacity: 1; }
                        36%, 100% { transform: translateX(258.8px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .k1, .k2, .l, .dim, .t, .dot { animation: none; opacity: 1; stroke-dashoffset: 0; } .dot { opacity: 0; } }
  </style>
