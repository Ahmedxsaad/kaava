[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprints"
version = "0.1.0"
description = "Kaava: verified answers to questions about construction drawings (Junction 2026, Stoa: Make Blueprints Talk)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "cloudinary>=1.40",
    "ezdxf>=1.3",
    "fastapi>=0.110",
    "google-genai>=1.0",
    "ifcopenshell>=0.8",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "rapidocr>=3.4",
    "shapely>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
