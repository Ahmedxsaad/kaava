[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprints"
version = "0.1.0"
description = "Verified answers to questions about construction drawings (Junction 2026, Stoa: Make Blueprints Talk)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "ezdxf>=1.3",
    "google-genai>=1.0",
    "ifcopenshell>=0.8",
    "pillow>=10",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
