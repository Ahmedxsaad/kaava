# Every push is checked three ways: the test suite, the web app's build, and an accuracy regression
# (the exact engines on the dataset's preview must stay as right as they are, with no wrong Verified answer).
#
# The jobs run on CRACI's runners (https://craci.com, a Junction 2026 tech partner): CRACI records every
# dependency a build pulls in and produces a CycloneDX SBOM of it. Each job asks for CRACI's ubuntu-24.04
# image, the software set the jobs were written against. CRACI's GitHub App must be installed on the
# repository, or the jobs wait for a runner that never comes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: craci
    timeout-minutes: 25
    steps:
      - uses: cracicorp/setup@v1
        with:
          image: ubuntu-24.04
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint (unused and undefined names)
        run: uvx ruff check --select F src scripts tests
      - name: Test
        run: .venv/bin/python -m pytest -q
        env:
          BLUEPRINTS_OFFLINE: "1"   # no outside service is reached from a test

  web:
    name: Web app
    runs-on: craci
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: cracicorp/setup@v1
        with:
          image: ubuntu-24.04
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build

  accuracy:
    name: Accuracy regression
    runs-on: craci
    timeout-minutes: 30
    steps:
      - uses: cracicorp/setup@v1
        with:
          image: ubuntu-24.04
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: The dataset's preview (0.5 GB, kept between runs)
        id: preview
        uses: actions/cache@v4
        with:
          path: data/junction-dataset-preview
          key: dataset-preview-v1
      - name: Download the preview
        if: steps.preview.outputs.cache-hit != 'true'
        run: bash 02-dataset/download.sh preview && rm -f data/junction-dataset-preview.zip
      - name: Exact engines on the preview's development drawings
        run: .venv/bin/python scripts/ci_regression.py
